name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + test + secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        # Pinned via .python-version. Without the pin uv installs the newest
        # interpreter, which for scipy 1.18.1 has no wheel — the runner then
        # tries a source build and fails on a missing OpenBLAS. CI must resolve
        # the same wheels a developer does, or the lock file stops meaning
        # anything.
        run: uv python install

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Secret scan
        # The same scanner that runs as the local pre-commit hook. Enforcing it
        # in CI means a clone that never set core.hooksPath cannot leak either.
        run: python3 scripts/check_no_secrets.py

      - name: Test
        run: uv run pytest -q

      - name: Dag check
        # Registers the scorecard package and its public surface, so a broken
        # import in the measurement layer fails here rather than in production.
        run: uv run python -c "import gridbot.scorecard as s; print('scorecard exports:', len(s.__all__))"
