[project]
name = "gridbot"
version = "0.1.0"
description = "Experiment factory for esports prediction markets on GRID Open Access data"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0.0",
    "httpx>=0.27",
    "keyring>=25",
    "lightgbm>=4.7.0",
    "numpy>=2.5.2",
    "polymarket-us>=0.1.2",
    "scikit-learn>=1.9.0",
    "secretstorage>=3.3",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Repo-wide `ruff check .` is green by construction; these are the DELIBERATE
# idioms (docs/MAP.md, .claude/skills/verify-and-land), not suppressions:
# BLE001/S110/S112 — fail-soft catches in ops and analysis code (a bad row or a
# dead venue call skips, never crashes a recorder); TRY004 — instruments raise
# ValueError for wrong-shaped inputs and callers/tests depend on that type.
ignore = ["BLE001", "S110", "S112", "TRY004"]

[tool.ruff.lint.per-file-ignores]
# subprocess.run without check=: tests assert returncode explicitly; the three
# operator tools read it themselves (a non-zero child is a status, not a crash).
"tests/*" = ["PLW1510"]
"scripts/night_alerts.py" = ["PLW1510"]
"scripts/pmap_calibration.py" = ["PLW1510"]
"scripts/watch_night.py" = ["PLW1510"]
