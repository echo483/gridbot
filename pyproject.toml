[project]
name = "gridbot"
version = "0.1.0"
description = "Experiment factory for esports prediction markets on GRID Open Access data"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0.0",
    "httpx>=0.27",
    "keyring>=25",
    "lightgbm>=4.7.0",
    "numpy>=2.5.2",
    "scikit-learn>=1.9.0",
    "secretstorage>=3.3",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
